name: Atlantic Industrial Group

description: Atlantic Industrial Group (AIG) is a vertically and horizontally integrated holding company focusing on logistics, propulsion, software,
  and aerospace. It acquires and develops superior products and efficient manufacturing assets, including VTOL drones and industrial chemicals.
  The company operates through subsidiaries such as AIG Aerospace and offers services in fabrication, manufacturing engineering, logistics technology,
  industrial chemicals, and scientific innovation.

